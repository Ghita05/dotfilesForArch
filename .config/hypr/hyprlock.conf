# hyprlock.conf
# High-quality lock screen with smooth animations

general {
    grace = 0
    ignore_empty_input = true
}

# Background with minimal blur
background {
    monitor =
    path = ~/.config/wallpapers/mountfuji.jpg
    blur_passes = 1
    blur_size = 3
    noise = 0.01
    contrast = 1.0
    brightness = 0.7
    vibrancy = 0.15
    vibrancy_darkness = 0.5
}

# Time display - Main focus
label {
    monitor =
    text = cmd[update:500] echo "$(date +'%H:%M')"
    color = rgba(212, 216, 224, 1.0)
    font_size = 80
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date display with subtle styling
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%a %d %b')"
    color = rgba(150, 160, 175, 0.8)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 35
    halign = center
    valign = center
}

# Password input field with enhanced animations
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    
    # Normal state colors
    outer_color = rgba(90, 104, 128, 0.25)
    inner_color = rgba(20, 22, 28, 0.5)
    font_color = rgba(212, 216, 224, 0.9)
    
    # Text styling
    placeholder_text = <span foreground="##7a8a98" font_style="italic">password</span>
    hide_input = false
    fade_on_empty = true
    fade_timeout = 1000
    
    # Visual refinements
    rounding = 18
    capslock_color = rgba(255, 200, 100, 1.0)
    numlock_color = rgba(100, 180, 255, 1.0)
    bothlock_color = rgba(255, 150, 150, 1.0)
    invert_numlock = false
    
    # Success state - smooth green transition
    check_color = rgba(126, 180, 130, 0.9)
    
    # Failure state - smooth red transition with animation
    fail_color = rgba(200, 120, 130, 0.9)
    fail_text = <span foreground="##e0a0a8" font_style="italic">access denied</span>
    
    position = 0, -280
    halign = center
    valign = center
    
    # Enable border animation on focus
    border_color = rgba(100, 130, 160, 0.0)
}
