# hypridle auto lock (PORTABLE)

general {
    lock_cmd = pidof hyprlock || hyprlock
    # if you ever DO enable suspend, this restores the screen after wake:
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1) dim the backlight after 2.5 min idle (needs brightnessctl)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 2) lock after 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3) screen OFF after 5.5 min — THIS is the safe battery saver.
#    on-resume turns it back on the instant you touch a key/trackpad.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
